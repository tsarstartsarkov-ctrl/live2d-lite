<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1d26">
<title>Live2D Lite — аватар со скелетом</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1d26;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}
  .seg{display:flex;background:rgba(255,255,255,.08);border-radius:13px;padding:3px;
    backdrop-filter:blur(10px);pointer-events:auto}
  .seg button{border:0;background:transparent;color:#c7cde0;padding:9px 14px;border-radius:10px;
    font-size:13px;font-weight:600;font-family:inherit}
  .seg button.on{background:#fff;color:#151823}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;
    text-align:center;color:#8a90a6;font-size:13px;line-height:1.45;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="seg" id="modes">
    <button data-m="live" class="on">Оживить</button>
    <button data-m="pose">Скелет / поза</button>
  </div>
  <div class="seg">
    <button id="skel">Кости: вкл</button>
    <button id="reset">Сброс</button>
  </div>
  <div class="seg">
    <button id="exp">Экспорт позы</button>
    <button id="impBtn">Импорт</button>
    <button id="pngBtn">Спрайт PNG</button>
    <button id="stdBtn">Стандарт</button>
  </div>
</div>
<input type="file" id="imp" accept=".json,application/json" style="display:none">
<input type="file" id="png" accept="image/*" style="display:none">
<div id="hint"></div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

/* ---------- СКЕЛЕТ ----------
   Кость: p (родитель), ox/oy (смещение в локальной системе родителя),
   a (угол относительно родителя, градусы; 0 = вправо, 90 = вниз).      */
const DEF = { torso:-90, head:0, armL:225, armR:135 };
let bones = {};
function makeBones(){
  bones = {
    root:{ p:null, ox:0,  oy:0,  a:0 },
    torso:{p:'root', ox:0, oy:0,  a:DEF.torso },
    head: {p:'torso',ox:95,oy:0,  a:DEF.head },
    eyeL: {p:'head', ox:42,oy:24, a:0 },
    eyeR: {p:'head', ox:42,oy:-24,a:0 },
    armL: {p:'torso',ox:72,oy:30, a:DEF.armL },
    armR: {p:'torso',ox:72,oy:-30,a:DEF.armR },
    legL: {p:'root', ox:18,oy:0,  a:90 },
    legR: {p:'root', ox:-18,oy:0, a:90 }
  };
}
makeBones();
const ORDER = ['root','torso','head','eyeL','eyeR','armL','armR','legL','legR'];
function solve(){
  for(const k of ORDER){
    const b = bones[k];
    if(!b.p){ b.x = W/2; b.y = H*0.60; b.wa = 0; continue; }
    const p = bones[b.p], th = p.wa*Math.PI/180, c = Math.cos(th), s = Math.sin(th);
    b.x = p.x + b.ox*c - b.oy*s;
    b.y = p.y + b.ox*s + b.oy*c;
    b.wa = p.wa + b.a;
  }
}

/* ---------- СОСТОЯНИЕ ---------- */
let mode = 'live', showSkel = true, dragBone = null, sprite = null;
let ptr = { x:W/2, y:H*0.3, active:false };
let gaze = {x:0,y:0}, nextBlink = 2, blinkStart = -1;
let headVel = 0, lastT = 0;              // пружинная физика головы
const STIFF = 110, DAMP = 10;            // жёсткость / затухание пружины
const hints = {
  live:  'Коснись экрана — персонаж следит взглядом. Моргание, дыхание и физика пружин — автоматически.',
  pose:  'Перетаскивай суставы (голова, руки, корпус), чтобы поставить позу. Экспорт сохранит её в JSON.'
};
const hintEl = document.getElementById('hint');
function setHint(){ hintEl.textContent = hints[mode] + (showSkel ? '' : ' Кости скрыты.'); }
setHint();

/* ---------- УПРАВЛЕНИЕ ---------- */
document.getElementById('modes').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  mode = b.dataset.m; dragBone = null;
  document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on', x===b));
  setHint();
});
document.getElementById('skel').addEventListener('click', e=>{
  showSkel = !showSkel;
  e.target.textContent = 'Кости: ' + (showSkel ? 'вкл' : 'выкл');
  setHint();
});
document.getElementById('reset').addEventListener('click', ()=>{ makeBones(); headVel = 0; });
document.getElementById('stdBtn').addEventListener('click', ()=>{ sprite = null; makeBones(); headVel = 0; });

/* экспорт позы в JSON */
document.getElementById('exp').addEventListener('click', ()=>{
  const data = {
    app:'live2d-lite', version:1, time:new Date().toISOString(),
    bones:{ torso:bones.torso.a, head:bones.head.a, armL:bones.armL.a, armR:bones.armR.a }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'pose.json'; a.click();
  if(navigator.clipboard) navigator.clipboard.writeText(JSON.stringify(data)).catch(()=>{});
});
/* импорт позы из JSON */
const impInput = document.getElementById('imp');
document.getElementById('impBtn').addEventListener('click', ()=> impInput.click());
impInput.addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const d = JSON.parse(r.result);
      for(const k of ['torso','head','armL','armR'])
        if(d.bones && typeof d.bones[k] === 'number') bones[k].a = d.bones[k];
      headVel = 0;
    }catch(err){ alert('Файл не похож на позу: ' + err.message); } };
  r.readAsText(f); e.target.value = '';
});
/* свой PNG-спрайт на кости головы */
const pngInput = document.getElementById('png');
document.getElementById('pngBtn').addEventListener('click', ()=> pngInput.click());
pngInput.addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ const img = new Image();
    img.onload = ()=>{ sprite = img; };
    img.src = r.result; };
  r.readAsDataURL(f); e.target.value = '';
});

function evPos(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
function pickBone(p){
  let best = null, bd = 70;
  for(const k of ['head','armL','armR','torso']){
    const b = bones[k], d = Math.hypot(p.x-b.x, p.y-b.y);
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}
cv.addEventListener('pointerdown', e=>{
  const p = evPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true;
  if(mode === 'pose') dragBone = pickBone(p);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  const p = evPos(e);
  ptr.x = p.x; ptr.y = p.y;
  if(dragBone){
    const b = bones[dragBone], par = bones[b.p];
    let ang = Math.atan2(p.y-par.y, p.x-par.x)*180/Math.PI - par.wa;
    while(ang > 180) ang -= 360; while(ang < -180) ang += 360;
    if(dragBone.startsWith('arm')){
      const rest = DEF[dragBone];
      ang = Math.max(rest-75, Math.min(rest+75, ang));
    } else if(dragBone === 'head'){
      ang = Math.max(-38, Math.min(38, ang));
    }
    b.a = ang;
  }
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev, ()=>{ ptr.active = false; dragBone = null; }));

/* ---------- РИСОВАНИЕ ---------- */
const SKIN='#ffb3c1', SKIN_D='#e2798f', FACE='#fff1e0', LINE='#46324a';
function at(b, fn){ ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.wa*Math.PI/180); fn(); ctx.restore(); }
function capsule(len, w, color){
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,0);
  ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.stroke();
  ctx.lineCap = 'butt';
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); }

function drawChar(op){
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(bones.root.x, bones.root.y + 66, 86, 13, 0, 0, Math.PI*2); ctx.fill();
  for(const k of ['legL','legR']) at(bones[k], ()=>{
    capsule(40, 18, SKIN);
    circle(46, 0, 11); ctx.fillStyle = SKIN_D; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.stroke();
  });
  at(bones.torso, ()=>{
    rrect(-12, -33, 98, 66, 26); ctx.fillStyle = SKIN; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.stroke();
    rrect(16, -19, 52, 38, 16); ctx.fillStyle = '#ffe0e8'; ctx.fill();
  });
  for(const k of ['armL','armR']) at(bones[k], ()=>{
    capsule(44, 17, SKIN);
    circle(50, 0, 11); ctx.fillStyle = FACE; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.stroke();
  });
  at(bones.head, ()=>{
    for(const s of [1,-1]){
      circle(52, 46*s, 13); ctx.fillStyle = SKIN; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.stroke();
      circle(52, 46*s, 6); ctx.fillStyle = '#ffe0e8'; ctx.fill();
    }
    if(sprite){
      ctx.drawImage(sprite, 30-62, -62, 124, 124);
    } else {
      circle(30, 0, 56); ctx.fillStyle = FACE; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.stroke();
      ctx.beginPath();
      ctx.arc(30, 0, 56, Math.PI*0.62, Math.PI*1.38);
      ctx.lineTo(30, 0); ctx.closePath();
      ctx.fillStyle = '#5a4632'; ctx.fill();
      ctx.beginPath(); ctx.arc(58, 4, 9, Math.PI*0.2, Math.PI*0.8);
      ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,150,.35)';
      circle(48, 30, 8); ctx.fill(); circle(48, -30, 8); ctx.fill();
    }
  });
  for(const k of ['eyeL','eyeR']) at(bones[k], ()=>{
    ctx.save(); ctx.translate(4, 0); ctx.scale(1, Math.max(op, 0.05));
    circle(0, 0, 12.5); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = LINE; ctx.stroke();
    circle(gaze.x*0.5, gaze.y*0.5, 5.5); ctx.fillStyle = '#333'; ctx.fill();
    circle(gaze.x*0.5 - 1.6, gaze.y*0.5 - 1.6, 1.8); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  });
}
function drawSkeleton(){
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(140,180,255,.9)';
  for(const k of ORDER){
    const b = bones[k]; if(!b.p) continue;
    const p = bones[b.p];
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for(const k of ORDER){
    const b = bones[k];
    circle(b.x, b.y, k===dragBone ? 7 : 4);
    ctx.fillStyle = k===dragBone ? '#ffd166' : '#fff';
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#151823'; ctx.stroke();
  }
}

/* ---------- ЦИКЛ (пружинная физика) ---------- */
function frame(nowMs){
  const t = nowMs/1000;
  const dt = Math.min(0.05, lastT ? t - lastT : 0.016);
  lastT = t;
  solve();

  bones.head.ox = 95 + Math.sin(t*2.1)*1.6;   // дыхание

  if(mode === 'live'){
    const neck = bones.torso;
    let want = Math.atan2(ptr.y-neck.y, ptr.x-neck.x)*180/Math.PI - neck.wa;
    while(want > 180) want -= 360; while(want < -180) want += 360;
    want = Math.max(-32, Math.min(32, want));
    if(!ptr.active) want = Math.sin(t*0.7)*8; // ленивое покачивание в покое
    // пружина: ускорение = -k*x - c*v
    const f = (want - bones.head.a)*STIFF - headVel*DAMP;
    headVel += f*dt;
    bones.head.a += headVel*dt;
    bones.torso.a += ((DEF.torso + want*0.3) - bones.torso.a)*0.08;
    bones.armL.a = DEF.armL + Math.sin(t*1.6)*5 + bones.head.a*0.15;
    bones.armR.a = DEF.armR + Math.sin(t*1.6 + Math.PI)*5 + bones.head.a*0.15;
    const th = bones.head.wa*Math.PI/180;
    const fx = bones.head.x + Math.cos(th)*45, fy = bones.head.y + Math.sin(th)*45;
    let gx = 0, gy = 0;
    if(ptr.active){
      gx = Math.max(-1, Math.min(1, (ptr.x-fx)/110));
      gy = Math.max(-1, Math.min(1, (ptr.y-fy)/110));
    }
    gaze.x += (gx*9 - gaze.x)*0.15; gaze.y += (gy*7 - gaze.y)*0.15;
  }

  if(t > nextBlink){ blinkStart = t; nextBlink = t + 2.2 + Math.random()*3.5; }
  let op = 1;
  const bp = (t - blinkStart)/0.22;
  if(bp >= 0 && bp < 1) op = bp < 0.5 ? 1 - bp*2 : (bp - 0.5)*2;

  ctx.clearRect(0, 0, W, H);
  drawChar(op);
  if(showSkel) drawSkeleton();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
